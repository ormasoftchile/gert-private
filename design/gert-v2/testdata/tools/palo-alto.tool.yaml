name: palo-alto
source: builtin://palo-alto
transport:
  type: stdio
  command: gert-stub
  args: ["--tool", "palo-alto"]
actions:
  - name: send-message
    description: Send a Slack message
    inputs:
      channel: { type: string, required: true }
      message: { type: string, required: true }
    outputs:
      result: { type: string }
