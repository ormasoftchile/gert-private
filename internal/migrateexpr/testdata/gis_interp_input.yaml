# E-001/E-002/E-003: simple variable interpolation
$schema: "https://schemas.gert.dev/runbook/v2.json"
apiVersion: runbook/v2
id: test-gis-interp
name: Test GIS interpolation

inputs:
  task_name:
    type: string
  host:
    type: string
  port:
    type: integer

flow:
  - step:
      id: s1
      type: cli
      title: "Running task {{ .task_name }} on {{ .host }}"
      command: echo
      args: ["host={{ .host }}", "port={{ .port }}", "task={{ .task_name }}"]

  - step:
      id: s2
      type: cli
      title: "Deep path {{ .config.region }}"
      command: echo
      args: ["region={{ .config.region }}", "item={{ .items[0] }}"]
