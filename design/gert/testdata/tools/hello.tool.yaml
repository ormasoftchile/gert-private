name: gert.hello
source: extension://hello-ext
description: Reference tool contributed by hello-ext extension for testing
transport:
  type: extension
  extension: hello-ext
actions:
  - name: greet
    description: Returns a greeting message
    inputs:
      name:
        type: string
        required: true
        description: Name to greet
    outputs:
      result:
        type: string
        description: Greeting message
