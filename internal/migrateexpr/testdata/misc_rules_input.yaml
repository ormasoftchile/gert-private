# Fixture: E-008 (iterate.over jq-style path), E-010 (template pipe warn), E-011 (now function)
$schema: "https://schemas.gert.dev/runbook/v2.json"
apiVersion: runbook/v2
id: test-misc-rules
name: Test misc rules

inputs:
  services:
    type: array
    default: ["svc-alpha", "svc-beta"]

flow:
  - step:
      id: s1
      type: cli
      title: Iterate over services
      iterate:
        over: "$.services"
        as: svc
      command: echo
      args: ["service={{ .svc }}"]

  - step:
      id: s2
      type: cli
      title: "Timestamp: {{ now }}"
      command: date
      args: ["-u"]
      capture:
        ts: stdout
