apiVersion: tool/v1
meta:
  name: icm
  version: "1.0.0"
  description: "IcM incident management — VS Code MCP binding."
transport:
  mode: vscode-mcp
  vscode_tool: mcp_icm_mcp_serve_get_incident_details_by_id
actions:
  - name: get-incident
    description: "Retrieve an IcM incident by ID."
    classification: read-only
    idempotent: true
    args:
      incident_id:
        type: string
        required: true
        description: "IcM incident ID"
    vscode_input:
      incidentId:
        from: incident_id
        coerce: integer
        required: true
    outputs:
      title:
        type: string
        required: true
        description: "Incident title"
      service:
        type: string
        required: true
        description: "Owning service name"
      environment:
        type: string
        required: true
        description: "Affected environment"
      logical_server:
        type: string
        required: true
        description: "Logical server name"
      database:
        type: string
        required: true
        description: "Database name"
