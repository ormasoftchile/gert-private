# gert-domain-errand — sketch v0
# An errand = a government/legal procedure with a definite outcome.
# Examples: renew driver's license, register a business, pay property tax.
# Members: usually small. Roles: applicant, representative, witness.

case:
  id: renovacion_licencia_2026
  label: Renovación de licencia de conducir
  jurisdiction: cl-municipal-providencia
  applicant: alex
  representative: null              # optional power-of-attorney
  opened: 2026-05-05
  deadline: 2026-08-12              # license expiration
  status: in_progress

# "zones" → "stages" — stricter ordering than home zones.
stages:
  - id: prerequisites
    label: Reunir documentos previos
  - id: medical_exam
    label: Examen médico
  - id: appointment
    label: Cita en municipalidad
  - id: payment
    label: Pago de derechos
  - id: issuance
    label: Emisión

# "routines" → "procedures" — strictly ordered, blocking, signed.
procedures:
  - id: get_medical_certificate
    label: Obtener certificado médico
    stage: medical_exam
    blocks: [appointment]
    evidence:
      type: signed_document
      prompt: Certificado firmado por médico autorizado
      retention: 7y                 # legal requirement
    assigned_to: alex
    due: 2026-06-15

  - id: book_appointment
    label: Reservar hora en municipalidad
    stage: appointment
    requires: [get_medical_certificate]
    evidence:
      type: confirmation_number
      prompt: Número de cita asignado por sistema
    due: 2026-07-01

  - id: pay_fees
    label: Pagar derechos municipales
    stage: payment
    requires: [book_appointment]
    evidence:
      type: receipt
      prompt: Comprobante de pago
      retention: 7y
    amount: 28350
    currency: CLP

  - id: collect_license
    label: Retirar licencia
    stage: issuance
    requires: [pay_fees]
    evidence:
      type: photo
      prompt: Foto de la licencia entregada

# consumables → none (errands consume nothing recurring)

# incident_templates → escalations
escalations:
  - id: missing_document
    label: Documento faltante o rechazado
    steps:
      - { id: identify_missing, type: human_task, label: Identificar qué falta }
      - { id: obtain,           type: human_task, label: Obtener documento }
      - { id: resubmit,         type: human_task, label: Volver a presentar }

# ──────────────────────────────────────────────────────────────────
# Wire-format check:
# - Tenant id = case id (e.g. "renovacion_licencia_2026").
# - Domain   = "errand-cl".
# - Members  = applicant + optional representative + optional witnesses.
# - Roles    = applicant | representative | witness (kit-defined).
# - /data    = this whole document, opaque to backend.
# - Invites  = applicant invites representative or witness.
# - Compliance profile = errand-cl (retention 7y, signed_chain audit, field-level
#   encryption for RUT, pii_export_endpoint required by Ley 21.719).
# - Verdict: fits the generic Tenant model. The strictness lives in the kit
#   (procedure ordering, signed evidence) and in the per-domain compliance
#   config (retention, audit mode), not in new wire endpoints. ✅
#
# Things the home kit doesn't have that this kit DOES need:
#   - ordered/blocked procedures (kit-level constraint, not backend's problem)
#   - signed_document evidence type (signing service exists at platform layer
#     anyway, just a new evidence kind)
#   - retention override per-evidence (already implied by per-domain config;
#     kit can declare per-procedure overrides as hints)
# None of these change the wire shape. All live above the platform.
