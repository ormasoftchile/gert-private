# gert-domain-trip — sketch v0
# A trip = a finite, time-bounded shared subject.
# Members: trip companions. Roles: organizer, participant, viewer.

trip:
  name: Patagonia Hike — Nov 2026
  starts: 2026-11-08
  ends:   2026-11-15
  participants:
    - { user: alex,    role: organizer }
    - { user: carlos,  role: participant }
    - { user: sara,    role: participant }

# "zones" → "legs" in this domain. Same role on the wire (a tag for filtering).
legs:
  - id: santiago_to_puerto_montt
    label: Santiago → Puerto Montt
    date: 2026-11-08
  - id: torres_del_paine
    label: Torres del Paine trek
    dates: [2026-11-09, 2026-11-13]
  - id: return
    label: Return home
    date: 2026-11-15

# "routines" → "checklists" or "bookings". Different cadence model:
# trip items are one-shot, anchored to a date, not recurring.
checklists:
  - id: pack_trekking_kit
    label: Pack trekking gear
    leg: torres_del_paine
    due: 2026-11-07
    assigned_to: alex
    items:
      - tent (3-person)
      - sleeping bag rated -5°C
      - water filter
    evidence:
      type: photo
      prompt: Photo of packed bag with all items visible

bookings:
  - id: flight_scl_pmc
    label: LATAM 281 SCL→PMC
    leg: santiago_to_puerto_montt
    confirmation: ABC123
    assigned_to: alex
    evidence:
      type: document
      prompt: PDF of e-ticket

# expenses replace consumables — finite spend, not stock-tracked
expenses:
  - id: park_entry_fee
    label: Torres del Paine entry fee
    leg: torres_del_paine
    amount: 32000
    currency: CLP
    paid_by: alex
    split: equal

# incident_templates → issue_templates (stuck at airport, lost passport, etc.)
issue_templates:
  - id: missed_connection
    label: Missed connection
    steps:
      - { id: contact_airline, type: human_task, label: Contact airline desk }
      - { id: rebook,          type: human_task, label: Get rebooked }
      - { id: notify_group,    type: human_task, label: Notify group via shared chat }

# ──────────────────────────────────────────────────────────────────
# Wire-format check:
# - Tenant id = trip id (e.g. "patagonia-2026-11").
# - Domain   = "trip".
# - Members  = participants[].user.
# - Roles    = organizer | participant | viewer (kit-defined; backend just stores strings).
# - /data    = this whole document, opaque to backend.
# - Invites  = same flow as home: organizer mints token, recipient redeems, joins as participant.
# - Compliance profile = trip.default (retention 365d, best_effort audit).
# - Verdict: fits the generic Tenant model with zero changes. ✅
