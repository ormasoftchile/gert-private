apiVersion: tool/v1
meta:
  name: tsg-recommendation
  version: "1.0.0"
  description: "TSG recommendation — VS Code MCP binding."
transport:
  mode: vscode-mcp
  provider_unresolved: true
actions:
  - name: recommend
    description: "Return a TSG recommendation for the current incident context."
    classification: read-only
    idempotent: true
    args:
      incident_id:
        type: string
        required: true
        description: "IcM incident ID"
      title:
        type: string
        required: true
        description: "Incident title"
      service:
        type: string
        required: true
        description: "Owning service name"
      environment:
        type: string
        required: true
        description: "Affected environment"
      logical_server:
        type: string
        required: true
        description: "Logical server name"
      database:
        type: string
        required: true
        description: "Database name"
    outputs:
      recommendation_status:
        type: string
        required: true
        description: "Outcome: 'suggested' or 'no-suggestion'"
      suggested_tsg_id:
        type: string
        required: false
        description: "TSG document ID (absent when recommendation_status is 'no-suggestion')"
      suggested_tsg_title:
        type: string
        required: false
        description: "TSG document title (absent when recommendation_status is 'no-suggestion')"
